<!DOCTYPE html>
<html>
<head>
  <title>Neural Table with Loss</title>
  <style>
    table {
      border-collapse: collapse;
      margin-top: 20px;
      font-family: Arial, sans-serif;
    }
    td, th {
      border: 1px solid #333;
      padding: 3px 10px;
      text-align: center;
      font-size: 12px;
    }
    th {
      background-color: #f2f2f2;
    }
    .highlight {
      background-color: #d1ffd1;
    }
    input {
      width: 60px;
    }
  </style>
</head>
<body>

<h2>Neural Table with Probabilities + Loss</h2>

<div>
  W: 
  <input id="w0" type="number" step="0.1" value="0.5">
  <input id="w1" type="number" step="0.1" value="-1.2">
  &nbsp;&nbsp;
  B: 
  <input id="b" type="number" step="0.1" value="0.1">
</div>

<br>

<div>
  Target Letter:
  <input id="target" type="text" maxlength="1" value="k">
  <button onclick="generate()">Recompute</button>
</div>

<p id="selectedInfo"></p>

<table id="table">
  <thead>
    <tr>
      <th>Letter</th>
      <th>Embedding (X)</th>
      <th>X</th>
      <th>W</th>
      <th>B</th>
      <th>XW + B</th>
      <th>Sigmoid (Prob)</th>
      <th>Output (selected)</th>
      <th>MSE Loss</th>
      <th>Cross-Entropy</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const letters = "abcdefghijklmnopqrstuvwxyz".split("");
  const baseEmb = [0.283, -0.232];

  function randomize(val) {
    return val + (Math.random() - 0.5) * 0.1;
  }

  function sigmoid(x) {
    return 1 / (1 + Math.exp(-x));
  }

  function generate() {
    const W = [
      parseFloat(document.getElementById("w0").value),
      parseFloat(document.getElementById("w1").value)
    ];
    const B = parseFloat(document.getElementById("b").value);

    const targetLetter = document.getElementById("target").value.toLowerCase();
    const targetIndex = letters.indexOf(targetLetter);

    const selectedRowIndex = Math.floor(Math.random() * 26);
	console.log(selectedRowIndex);

    document.getElementById("selectedInfo").innerText =
      "Selected row: [ " + letters[selectedRowIndex] + " ] index: " + selectedRowIndex;

    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";

    letters.forEach((letter, index) => {
      const X = [
        randomize(baseEmb[0]),
        randomize(baseEmb[1])
      ];

      const dot = X[0] * W[0] + X[1] * W[1];
      const z = dot + B;
      let prob = sigmoid(z);

      // avoid log(0)
      const eps = 1e-7;
      prob = Math.min(Math.max(prob, eps), 1 - eps);

      // target: 1 for selected letter, else 0
      const y = (index === targetIndex) ? 1 : 0;

      // losses
      const mse = Math.pow(y - prob, 2);
      const ce = -(y * Math.log(prob) + (1 - y) * Math.log(1 - prob));

      const row = document.createElement("tr");

      if (index === selectedRowIndex) {
        row.classList.add("highlight");
      }

      row.innerHTML = `
        <td>${letter}</td>
        <td>[${X[0].toFixed(3)}, ${X[1].toFixed(3)}]</td>
        <td>${X[0].toFixed(3)} * ${W[0]} + ${X[1].toFixed(3)} * ${W[1]}</td>
        <td>[${W[0]}, ${W[1]}]</td>
        <td>${B}</td>
        <td>${z.toFixed(3)}</td>
        <td>${prob.toFixed(4)}</td>
        <td>${index === selectedRowIndex ? prob.toFixed(4) : ""}</td>
        <td>${mse.toFixed(4)}</td>
        <td>${ce.toFixed(4)}</td>
      `;

      tbody.appendChild(row);
    });
  }

  generate();
</script>

</body>
</html>
